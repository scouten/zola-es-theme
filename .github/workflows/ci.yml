name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bulma_subset:
    name: Bulma subset compiles and covers the templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zola
        run: |
          curl -sSL https://github.com/getzola/zola/releases/download/v0.19.2/zola-v0.19.2-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv zola /usr/local/bin/zola
          zola --version

      - name: Check the subset
        run: tools/check_bulma_subset.py
